services:
  postgres:
    image: postgres:16-alpine
    container_name: cole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cole_user
      POSTGRES_PASSWORD: cole_password
      POSTGRES_DB: cole_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cole_user -d cole_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cole-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cole-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: cole_guest
      RABBITMQ_DEFAULT_PASS: cole_guest_pass
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cole-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: cole_minio_admin
      MINIO_ROOT_PASSWORD: cole_minio_secret_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
