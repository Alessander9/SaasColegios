name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------
  # Lint & Type Check
  # ---------------------------------------------------------------
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @cole/domain-types build
          pnpm --filter @cole/logger build
          pnpm --filter @cole/database build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

      - name: TypeCheck core-api
        run: pnpm --filter @cole/core-api typecheck

      - name: TypeCheck domain-types
        run: pnpm --filter @cole/domain-types typecheck

  # ---------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @cole/domain-types build
          pnpm --filter @cole/logger build
          pnpm --filter @cole/database build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

      - name: Run Tests
        run: pnpm --filter @cole/core-api test -- --no-coverage
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

  # ---------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------
  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build All
        run: pnpm build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

  # ---------------------------------------------------------------
  # Production image smoke check
  # ---------------------------------------------------------------
  docker:
    name: Build Core API Image
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f services/core-api/Dockerfile -t cole-core-api:ci .

  # ---------------------------------------------------------------
  # Staging HTTP E2E
  # ---------------------------------------------------------------
  e2e:
    name: Staging HTTP E2E
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cole_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cole_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: |
          pnpm --filter @cole/domain-types build
          pnpm --filter @cole/logger build
          pnpm --filter @cole/database build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cole_platform
      - name: Migrate and seed
        run: pnpm --filter @cole/database exec prisma migrate deploy && pnpm --filter @cole/database exec prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cole_platform
      - name: Start API
        run: pnpm --filter @cole/core-api start > /tmp/cole-api.log 2>&1 &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cole_platform
          JWT_SECRET: ci-e2e-jwt-secret
          PORT: 3100
      - name: Wait for API
        run: for i in {1..30}; do curl --fail http://localhost:3100/api/v1/health && exit 0; sleep 2; done; cat /tmp/cole-api.log; exit 1
      - name: Run Academic and Payroll E2E
        shell: pwsh
        run: ./scripts/academic-payroll-e2e.ps1 -BaseUrl http://localhost:3100/api/v1
      - name: Run Commerce E2E
        shell: pwsh
        run: ./scripts/commerce-e2e.ps1 -BaseUrl http://localhost:3100/api/v1
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run four-portal browser E2E
        shell: pwsh
        run: ./scripts/browser-e2e-local.ps1
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3100/api/v1



